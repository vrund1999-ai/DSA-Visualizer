<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive, step-by-step visualizers for data structures and algorithms. Watch sorting, pathfinding, trees, and more come to life."
    />
    <title>DSA Visualizer — Learn Data Structures & Algorithms Visually</title>
    <!-- SPA redirect decode: restores deep-link paths bounced through 404.html
         on GitHub Pages (which has no server-side rewrites). -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
